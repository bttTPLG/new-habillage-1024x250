<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Habillage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <style>
      html,
      body {
        margin: 0;
        background: #ffffff;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
      }

      .TPLG-mid {
        max-width: 1024px;
        width: 100%;
        height: 250px;
        background-image: url("https://raw.githubusercontent.com/bttTPLG/img/refs/heads/main/asset/fond2.png");
        display: flex;
        flex-direction: row;
        align-items: center;
      }

      /* Text */

      .text-container {
        width: 480px;
        height: 250px;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        box-sizing: border-box;
        padding: 5px 0 0 0;
      }

      .LOGO-devis {
        height: fit-content;
        width: 100%;
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: flex-start;
      }

      .TPLG-LOGO-container {
        width: fit-content;
        height: fit-content;
        background-color: rgba(255, 255, 255, 0.588);
        padding-left: 5px;
        padding-right: 5px;
        padding-top: 5px;
      }

      .TPLG-LOGO {
        width: 150px;
      }

      .TPLG-devis-container {
        background-color: #e30713;
        width: fit-content;
        height: fit-content;
        padding: 5px 10px;
        border-radius: 25px 0 0 25px;
        border-top: solid 2px white;
        border-left: solid 2px white;
        border-bottom: solid 2px white;
        animation: pulse-container 2s steps(1) infinite;
      }

      @keyframes pulse-container {
        0%,
        49% {
          background-color: #e30713;
          border-top: solid 3px white;
          border-left: solid 3px white;
          border-bottom: solid 3px white;
        }

        50%,
        100% {
          background-color: rgb(255, 255, 255);
          border-left: solid 3px #e30713;
          border-top: solid 3px #e30713;
          border-bottom: solid 3px #e30713;
        }
      }

      .TPLG-devis-container p {
        font-size: 16px;
        font-family: Kanit, sans-serif;
        width: 100%;
        color: white;
        margin: 0;
        text-align: center;
        line-height: 15pt;
        font-weight: 400;
        animation: pulse-text 2s steps(1) infinite;
      }

      @keyframes pulse-text {
        0%,
        49% {
          color: white;
        }

        50%,
        100% {
          color: #e30713;
        }
      }

      .TPLG-text-carousel-container {
        width: 100%;
        height: 79px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        box-sizing: border-box;
      }

      .TPLG-text-carousel {
        position: relative;
        box-sizing: border-box;
        width: 100%;
        height: 30px;
        display: flex;
        justify-content: center;
      }

      .TPLG-text-carousel2 {
        height: 30px;
        position: relative;
        box-sizing: border-box;
        width: 100%;
        display: flex;
        justify-content: center;
      }

      .TPLG-text-carousel-container p {
        background-color: rgb(255, 255, 255);
        font-size: 18px;
        font-weight: 700;
        font-family: Kanit, sans-serif;
        position: absolute;
        text-transform: uppercase;
        opacity: 0;
        margin: 0;
        padding: 2px 8px;
      }

      .TPLG-text-carousel .animation-left {
        border-radius: 10px 0 0 0;
        border-top: solid 2px #000000;
        border-left: solid 4px #000000;
        color: #000000;
        animation: rotateText 16s infinite;
      }

      .TPLG-text-carousel2 .animation-right {
        color: #e30713;
        border-radius: 0 0 10px 0;
        animation: rotateText2 16s infinite;
        border-right: solid 4px #e30713;
        border-bottom: solid 1px #e30713;
      }

      .TPLG-text-carousel p:nth-child(1),
      .TPLG-text-carousel2 p:nth-child(1) {
        animation-delay: 0s;
      }

      .TPLG-text-carousel p:nth-child(2),
      .TPLG-text-carousel2 p:nth-child(2) {
        animation-delay: 4s;
      }
      .TPLG-text-carousel p:nth-child(3),
      .TPLG-text-carousel2 p:nth-child(3) {
        animation-delay: 8s;
      }
      .TPLG-text-carousel p:nth-child(4),
      .TPLG-text-carousel2 p:nth-child(4) {
        animation-delay: 12s;
      }

      @keyframes rotateText {
        0% {
          opacity: 0;
          transform: translateX(20px);
        }
        5% {
          opacity: 1;
          transform: translateX(0);
        }
        25% {
          opacity: 1;
        }
        30% {
          opacity: 0;
          transform: translateX(-20px);
        }
        100% {
          opacity: 0;
        }
      }

      @keyframes rotateText2 {
        0% {
          opacity: 0;
          transform: translateX(-20px);
        }
        5% {
          opacity: 1;
          transform: translateX(0);
        }
        25% {
          opacity: 1;
        }
        30% {
          opacity: 0;
          transform: translateX(20px);
        }
        100% {
          opacity: 0;
        }
      }

      .services {
        width: 100%;
        height: 90px;
        display: flex;
        flex-direction: row;
        justify-content: space-around;
        align-items: center;
      }

      .item {
        width: fit-content;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
      }

      .item img {
        width: 60px;
        border: solid 1px #e30713;
        border-radius: 100px;
      }

      .item p {
        padding: 2px 4px;
        margin: 0;
        border-radius: 10px;
        background-color: #e30713;
        color: white;
        font-size: 12px;
        font-family: Kanit, sans-serif;
      }

      /* Vidéo */
      .video-container {
        max-width: 272px;
        height: 250px;
        background: transparent;
      }

      .video-container video {
        height: 100%;
        width: 100%;
        object-fit: cover;
        box-sizing: border-box;
      }

      .left {
        border-right: solid 4px #e30713;
      }

      .right {
        border-left: solid 4px #e30713;
      }

      .TPLG-global-link {
        position: absolute;
        max-width: 1024px;
        width: 100%;
        height: 250px;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1;
      }
    </style>
  </head>

  <body>
    <div class="TPLG-mid">
      <a
        href="https://www.toutpourlegrain.fr/fr/"
        target="_blank"
        class="TPLG-global-link"
      >
      </a>
      <div class="video-container left">
        <video autoplay muted loop playsinline>
          <source
            src="https://raw.githubusercontent.com/bttTPLG/img/refs/heads/main/asset/video-drone.mp4"
            type="video/mp4"
          />
          Votre navigateur ne prend pas en charge la lecture vidéo.
        </video>
      </div>
      <div class="text-container">
        <div class="LOGO-devis">
          <div class="TPLG-LOGO-container">
            <img
              src="https://www.toutpourlegrain.fr/images/Logo-TPLG.svg"
              alt="Logo Tout Pour Le Grain"
              class="TPLG-LOGO"
            />
          </div>
          <div class="TPLG-devis-container">
            <p>Devis gratuit</p>
          </div>
        </div>

        <div class="TPLG-text-carousel-container">
          <div class="TPLG-text-carousel">
            <p class="animation-left">Stockez vos récoltes</p>
            <p class="animation-left">Expertise technique</p>
            <p class="animation-left">Votre projet de stockage</p>
            <p class="animation-left">étude gratuite</p>
          </div>
          <div class="TPLG-text-carousel2">
            <p class="animation-right">à moindre coût</p>
            <p class="animation-right">depuis plus de 65 ans</p>
            <p class="animation-right">sur-mesure</p>
            <p class="animation-right">et personnalisée</p>
          </div>
        </div>
        <div class="services">
          <div class="item">
            <img
              src="https://raw.githubusercontent.com/bttTPLG/img/refs/heads/main/asset/Stockage.png"
              alt="Stockage"
            />
            <p>Stockage</p>
          </div>
          <div class="item">
            <img
              src="https://raw.githubusercontent.com/bttTPLG/img/refs/heads/main/asset/Manutention.png"
              alt="Manutention"
            />
            <p>Manutention</p>
          </div>
          <div class="item">
            <img
              src="https://raw.githubusercontent.com/bttTPLG/img/refs/heads/main/asset/Ventilation.png"
              alt="Ventilation"
            />
            <p>Ventilation</p>
          </div>
          <div class="item">
            <img
              src="https://raw.githubusercontent.com/bttTPLG/img/refs/heads/main/asset/Nettoyage.png"
              alt="Nettoyage"
            />
            <p>Nettoyage</p>
          </div>
          <div class="item">
            <img
              src="https://raw.githubusercontent.com/bttTPLG/img/refs/heads/main/asset/S%C3%A9chage.png"
              alt="Séchage"
            />
            <p>Séchage</p>
          </div>
          <div class="item">
            <img
              src="https://raw.githubusercontent.com/bttTPLG/img/refs/heads/main/asset/Automatisation.png"
              alt="Automatisation"
            />
            <p>Automatisation</p>
          </div>
        </div>
      </div>
      <div class="video-container right">
        <video autoplay muted loop playsinline>
          <source
            src="https://raw.githubusercontent.com/bttTPLG/img/refs/heads/main/asset/video-drone.mp4"
            type="video/mp4"
          />
          Votre navigateur ne prend pas en charge la lecture vidéo.
        </video>
      </div>
    </div>
  </body>
</html>
